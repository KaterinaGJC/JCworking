<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>景臣的工作生活</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="app">

  <svg style="display:none" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.4l2.6 2.6L16 9.6"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.6" r="3.2"/><path d="M3.6 19.6c0-3 2.4-5 5.4-5s5.4 2 5.4 5"/><path d="M16 5.8a3.2 3.2 0 0 1 0 6.2M17.4 15c2 .7 3.4 2.4 3.4 4.6"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="10.5" rx="5"/><path d="M8 10.4v3.4M6.3 12.1h3.4"/><circle cx="16.2" cy="11.4" r=".9" fill="currentColor" stroke="none"/><circle cx="17.9" cy="13.4" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5v4h4M9 13h6M9 16.5h4"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7.5h9M17.5 7.5H20M4 16.5h4M12 16.5h8"/><circle cx="14.8" cy="7.5" r="2.2"/><circle cx="9" cy="16.5" r="2.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5 12 15.5 18 9.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.8"/><path d="M16.2 16.2 20.5 20.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.4l4.4 4.4L19 7.2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.2a1 1 0 0 0 1 1h7.4a1 1 0 0 0 1-1L17.5 7"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.7l5.4-.8z"/></symbol>
  </svg>

  <header class="topbar" id="topbar">
    <button class="icon-btn hidden" id="btnBack" aria-label="返回"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="titles">
      <h1 id="pageTitle">景臣</h1>
      <div class="sub" id="pageSub"></div>
    </div>
    <button class="icon-btn hidden" id="btnGear" aria-label="设置"><svg class="ico"><use href="#i-gear"/></svg></button>
    <button class="icon-btn hidden" id="btnStu" aria-label="学生"><svg class="ico"><use href="#i-people"/></svg></button>
    <button class="icon-btn hidden" id="btnSearch" aria-label="搜索"><svg class="ico"><use href="#i-search"/></svg></button>
    <button class="icon-btn hidden" id="btnPlus" aria-label="新增"><svg class="ico"><use href="#i-plus"/></svg></button>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <a class="tab" data-act="home" href="#/home"><svg class="ico"><use href="#i-home"/></svg>首页</a>
    <a class="tab" data-act="schedule" href="#/schedule"><svg class="ico"><use href="#i-cal"/></svg>课表</a>
    <a class="tab" data-act="fun" href="#/fun"><svg class="ico"><use href="#i-game"/></svg>娱乐</a>
    <a class="tab" data-act="memo" href="#/memo"><svg class="ico"><use href="#i-note"/></svg>备忘</a>
  </nav>

  <button class="fab hidden" id="fab" aria-label="新增"><svg class="ico"><use href="#i-plus"/></svg></button>

  <div id="overlay"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
